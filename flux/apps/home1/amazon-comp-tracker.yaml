apiVersion: v1
kind: Namespace
metadata:
  name: amazon-comp-tracker
---
apiVersion: v1
kind: Secret
metadata:
  name: amazon-comp-tracker-secrets
  namespace: amazon-comp-tracker
stringData:
  SECRET_KEY: "7c278ceb2320eb83265a1bb94432f0c4d580342d185cb60d19ca7712d35aaaab"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amazon-comp-tracker-data
  namespace: amazon-comp-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-comp-tracker
  namespace: amazon-comp-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amazon-comp-tracker
  template:
    metadata:
      labels:
        app: amazon-comp-tracker
    spec:
      containers:
      - name: amazon-comp-tracker
        image: ghcr.io/lwilts/amazon-comp-tracker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: amazon-comp-tracker-secrets
              key: SECRET_KEY
        - name: DATA_DIR
          value: /data
        - name: TZ
          value: "Europe/London"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/auth/status
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/auth/status
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: amazon-comp-tracker-data
---
apiVersion: v1
kind: Service
metadata:
  name: amazon-comp-tracker
  namespace: amazon-comp-tracker
spec:
  selector:
    app: amazon-comp-tracker
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: amazon-comp-tracker
  namespace: amazon-comp-tracker
spec:
  parentRefs:
  - name: lab-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "comp.lab.lkwt.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: amazon-comp-tracker
      port: 8000
